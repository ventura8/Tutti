name: release
# Builds a release's install files again with the release defaults (tutti/official.py): the built-in Google device
# client's secret (the Actions secret TUTTI_GOOGLE_DEVICE_SECRET) and the default Sentry DSN (the Actions variable
# TUTTI_SENTRY_DSN), then replaces the files scripts/release-patch.sh attached. Without them the release still works:
# the button sign-in on this computer is built in, and a household adds its own device client (docs/AUTH.md).
# It then signs SHA256SUMS with Sigstore, keyless (GitHub OIDC, actions/attest-build-provenance), and attaches the bundle as
# SHA256SUMS.sigstore.json: `tutti self-update` and the bootstrap refuse a release whose SHA256SUMS is not signed by this
# workflow on the release's v* tag (docs/INSTALL.md, *How a release is checked*). A manual run must be dispatched on the tag
# itself (`gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z`), or its signature names a branch and is refused.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: the release tag to rebuild, e.g. v0.1.60
        required: true
permissions:
  contents: write      # replace the release's files
  id-token: write      # the OIDC token Sigstore's keyless certificate is issued for
  attestations: write  # store the attestation on GitHub too
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: A dispatch runs on the tag itself (the signature names the ref it was made on; a branch's is refused)
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/tags/$TAG" ] || { echo "dispatch it on the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG (it ran on $REF)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build the install files with the release defaults
        env:
          TUTTI_GOOGLE_DEVICE_SECRET: ${{ secrets.TUTTI_GOOGLE_DEVICE_SECRET }}
          TUTTI_SENTRY_DSN: ${{ vars.TUTTI_SENTRY_DSN }}
        run: bash scripts/release-assets.sh "${TAG#v}" "$RUNNER_TEMP/assets" HEAD
      - name: Sign SHA256SUMS (Sigstore, keyless)
        id: sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/SHA256SUMS
      - name: Attach the signature bundle
        env:
          BUNDLE: ${{ steps.sign.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/assets/SHA256SUMS.sigstore.json"
      - name: Create the release when the tag has none (a dispatch for a tag that was pushed without one)
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # drafts too (a run that stopped half-way left one): it is published, never a second one made
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .draft" | head -n 1)
          if [ "$draft" = false ]; then echo "made=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$draft" ]; then
            awk -v v="${TAG#v}" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            [ -s "$RUNNER_TEMP/notes.md" ] || echo "Tutti ${TAG#v}: see CHANGELOG.md." > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Tutti ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false > /dev/null
          fi
          echo "made=1" >> "$GITHUB_OUTPUT"
      - name: Replace the release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber --repo "$GITHUB_REPOSITORY"
