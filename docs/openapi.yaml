openapi: 3.1.0
info:
  title: Tutti API
  summary: Dashboard and Household Coordinator HTTP APIs
  description: |
    OpenAPI 3.1 specification for the Tutti orchestration toolkit HTTP APIs.
    
    Tutti operates two distinct local HTTP services on private loopback/LAN/VPN networks:
    - **Dashboard HTTP API (:4777)**: serves the dashboard state, machine and worker controls, settings management, user and schedule administration, telemetry, and interactive agent chat.
    - **Household Coordinator HTTP API (:4778)**: handles peer member synchronization, fair shares, machine slot leases, and delegated job execution across household machines.
    
    ### Security and Roles
    - **Public (anyone)**: Unauthenticated endpoints (`/api/health`, `/api/auth/me`, `/api/auth/login`, `/api/auth/device/*`, `/hh/health`).
    - **Viewer**: Authenticated members with read permissions and access to user-facing utilities (`/api/state`, `/api/vpn/status`, `/api/docs`, etc.).
    - **Self**: Authenticated users acting on their own data or resources (an admin may act for anyone).
    - **Admin**: Full control over configuration, machines, workers, accounts, queue, and user permissions.
    - **Household Member / Admin**: Signed HMAC requests using member tokens for coordinator operations (`/hh/*`).
    
    Every mutating POST request on the dashboard requires same-origin requests with the `X-Tutti-Token` header.
  version: 0.23.7
  license:
    name: MIT
    url: https://github.com/ventura8/Tutti/blob/main/LICENSE
servers:
  - url: http://127.0.0.1:4777
    description: Dashboard HTTP API (default port 4777)
  - url: http://127.0.0.1:4778
    description: Household Coordinator HTTP API (default port 4778)

tags:
  - name: Dashboard State & Health
    description: Health checks and full system state inspection
  - name: Dashboard Settings & System
    description: Configuration management, updates, restarts, and setup
  - name: Dashboard Controls & Operations
    description: Worker switching, pause/resume controls, autopilot, dispatch, and device moves
  - name: Dashboard Auth & Users
    description: Sign-in, OAuth flows, user roles, invites, and personal schedules
  - name: Dashboard Communication & Tools
    description: Interactive agent chat, problem reports, telemetry, and browser tools
  - name: Dashboard API Docs
    description: Interactive documentation and schema specifications
  - name: Household Coordinator
    description: Peer synchronization, fair-share slot management, and household operations

paths:
  /api/health:
    get:
      tags:
        - Dashboard State & Health
      summary: Dashboard health check
      description: "Returns server operational status, start timestamp, hostname, and version. Role: public (anyone)."
      operationId: getDashboardHealth
      security: []
      responses:
        '200':
          description: Server is running and healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardHealth'

  /api/state:
    get:
      tags:
        - Dashboard State & Health
      summary: Get full dashboard state
      description: "Returns complete snapshot of all dashboard state. Supports conditional GET with ETag and gzip compression. Role: viewer."
      operationId: getDashboardState
      security:
        - sessionCookie: []
      parameters:
        - name: If-None-Match
          in: header
          description: ETag from a previous state response for cache validation
          required: false
          schema:
            type: string
        - name: Accept-Encoding
          in: header
          description: Encoding preference (e.g. gzip)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Full dashboard state snapshot
          headers:
            ETag:
              schema:
                type: string
              description: Weak entity tag for caching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardState'
        '304':
          description: State has not changed since the specified ETag
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/settings:
    get:
      tags:
        - Dashboard Settings & System
      summary: Get settings tab schema and values
      description: "Returns all configurable settings sections, fields, current values, defaults, and file etag. Role: admin."
      operationId: getSettings
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current settings view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Dashboard Settings & System
      summary: Update settings
      description: "Updates a setting by path, reorders projects, or merges divergent configurations. Role: admin."
      operationId: updateSettings
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: Setting updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict due to stale file ETag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 64 KB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/vpn/status:
    get:
      tags:
        - Dashboard Controls & Operations
      summary: Get private network (VPN) status
      description: "Returns the state of the private mesh network (e.g. Tailscale or WireGuard). Role: viewer."
      operationId: getVpnStatus
      security:
        - sessionCookie: []
      responses:
        '200':
          description: VPN status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpnStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/needs:
    get:
      tags:
        - Dashboard Controls & Operations
      summary: Get open user questions and notification settings
      description: "Returns open questions waiting for user decision and notification settings. Role: viewer (self) or admin."
      operationId: getNeeds
      security:
        - sessionCookie: []
      responses:
        '200':
          description: List of pending questions and notification preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedsView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Answer question or update notification preferences
      description: "Submits an answer to a pending question or updates notification settings. Role: viewer (self) or admin."
      operationId: postNeeds
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NeedsActionRequest'
      responses:
        '200':
          description: Action recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/welcome:
    get:
      tags:
        - Dashboard Controls & Operations
      summary: Get welcome back summary
      description: "Returns what changed since the user was last seen. Role: viewer (self) or admin."
      operationId: getWelcome
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User welcome back summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WelcomeView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Manage welcome summary
      description: "Mark summary as read, query missed items, or toggle feature. Role: viewer (self) or admin."
      operationId: postWelcome
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WelcomeActionRequest'
      responses:
        '200':
          description: Summary action processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me:
    get:
      tags:
        - Dashboard Auth & Users
      summary: Current authentication status and user details
      description: "Returns sign-in state, client configuration, and current user profile. Role: public (anyone)."
      operationId: getAuthMe
      security: []
      responses:
        '200':
          description: Authentication and identity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'

  /api/auth/login:
    post:
      tags:
        - Dashboard Auth & Users
      summary: Sign in with Google ID token
      description: "Verifies Google credential token against client ID and JWKS and issues session cookie. Role: public (anyone)."
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Session created successfully
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (`tutti_session_<port>=...; HttpOnly; SameSite=Strict`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/device/start:
    post:
      tags:
        - Dashboard Auth & Users
      summary: Start Google OAuth device flow
      description: "Requests user verification code and URI for browser sign-in on headless machines or TVs. Role: public (anyone)."
      operationId: authDeviceStart
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDeviceStartRequest'
      responses:
        '200':
          description: Device authorization flow initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDeviceStartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/device/poll:
    post:
      tags:
        - Dashboard Auth & Users
      summary: Poll Google OAuth device flow
      description: "Checks status of pending device flow until completed or expired. Role: public (anyone)."
      operationId: authDevicePoll
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Flow status (pending or authenticated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDevicePollResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/logout:
    post:
      tags:
        - Dashboard Auth & Users
      summary: Sign out
      description: "Invalidates active session and clears session cookie. Role: viewer, admin."
      operationId: authLogout
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Signed out successfully
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expired session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/users:
    get:
      tags:
        - Dashboard Auth & Users
      summary: List users, invites, and security audit log
      description: "Returns list of approved and pending users, active invites, and audit trail. Role: admin."
      operationId: getAuthUsers
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Users view data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Dashboard Auth & Users
      summary: Manage user accounts and permissions
      description: "Approves pending users, changes roles between viewer and admin, or removes users. Role: admin."
      operationId: manageAuthUsers
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserManageRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Cannot demote or remove the last remaining administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/invites:
    post:
      tags:
        - Dashboard Auth & Users
      summary: Create or revoke user invites
      description: "Generates a new invitation link with a specific role, or revokes an active invite. Role: admin."
      operationId: manageAuthInvites
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteActionRequest'
      responses:
        '200':
          description: Invite created or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/me/schedule:
    get:
      tags:
        - Dashboard Auth & Users
      summary: Get personal pacing schedule
      description: "Returns user's pacing mode, active days, hours, and time window. Role: viewer (self) or admin."
      operationId: getMySchedule
      security:
        - sessionCookie: []
      responses:
        '200':
          description: User schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Dashboard Auth & Users
      summary: Update personal pacing schedule
      description: "Updates pacing mode, active days, hours, or time window. Role: viewer (self) or admin."
      operationId: updateMySchedule
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdateRequest'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reading:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Record account usage reading
      description: "Logs usage percentage, quota reset timestamp, and optional note for an AI account. Role: admin."
      operationId: postUsageReading
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingRequest'
      responses:
        '200':
          description: Reading recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/refresh:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Refresh usage readings
      description: "Triggers immediate refresh from all configured automated account readers. Role: admin."
      operationId: postUsageRefresh
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Usage read results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Error reading usage log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/main:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Switch active main AI agent
      description: "Switches primary agent (e.g. Claude Code, Cursor, AGY). Role: admin."
      operationId: postMainAgent
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainAgentRequest'
      responses:
        '200':
          description: Main agent switched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainAgentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/autopilot:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Configure autopilot settings
      description: "Enables or disables automated background task execution and gap filling. Role: admin."
      operationId: postAutopilot
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutopilotRequest'
      responses:
        '200':
          description: Autopilot settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/self-improve:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Toggle self-improvement loops
      description: "Enables or disables automatic self-improvement and diagnostic tasks. Role: admin."
      operationId: postSelfImprove
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfImproveRequest'
      responses:
        '200':
          description: Self-improve setting updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/control:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Control machine, device, worker, or account state
      description: "Pauses, resumes, or toggles opt-in state for an infrastructure target. Role: admin."
      operationId: postControl
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlRequest'
      responses:
        '200':
          description: Control action executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/owner:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Update owner mode or schedule
      description: "Sets owner status (away, auto), working window, hours, or browser timezone. Role: admin."
      operationId: postOwner
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRequest'
      responses:
        '200':
          description: Owner settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/autocompact:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Set autocompact threshold
      description: "Sets memory/context compaction threshold percentage (10-95, or null to reset). Role: admin."
      operationId: postAutocompact
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutocompactRequest'
      responses:
        '200':
          description: Threshold updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/dispatch:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Control test dispatching
      description: "Enables or disables automated keep-busy test dispatching, or triggers an immediate dispatch round. Role: admin."
      operationId: postDispatch
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          description: Dispatch status or immediate assignment results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/docs:
    get:
      tags:
        - Dashboard API Docs
      summary: Swagger UI
      description: "Interactive API documentation. Role: viewer."
      operationId: getSwaggerUi
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Swagger UI
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Swagger UI page
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/connect:
    post:
      tags:
        - Dashboard Controls & Operations
      summary: Connect or test local AI agent integrations
      description: "Inspects configuration status, tests MCP servers, or connects/disconnects local agent tools. Role: admin."
      operationId: postConnect
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectRequest'
      responses:
        '200':
          description: Agent status or test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Unable to modify agent configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/restart:
    post:
      tags:
        - Dashboard Settings & System
      summary: Restart dashboard server
      description: "Triggers restart of dashboard process. Poll `/api/health` until started timestamp changes. Role: admin."
      operationId: postRestart
      security:
        - sessionCookie: []
        - csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Restart initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartResponse'
        '401':
