components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tutti_session
      description: |
        HTTP-only session cookie set after Google OAuth login (`tutti_session_<port>=...`).
        Required for authenticated dashboard access.
    csrfToken:
      type: apiKey
      in: header
      name: X-Tutti-Token
      description: |
        Cross-site request forgery prevention token sent with mutating POST requests.
        Matches the session CSRF token (with sign-in) or the per-start token (without sign-in).
    householdAuth:
      type: apiKey
      in: header
      name: X-Tutti-User
      description: |
        HMAC signature and user identifier for household coordinator requests (:4778).

  responses:
    BadRequest:
      description: Invalid request parameters, unrecognized action, or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthenticated request or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: User lacks sufficient permissions (e.g. admin role required or pending approval)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable explanation of what happened, why, and what to do next
          example: 'only an admin may open this: ask an admin to make you admin in the Users card'

    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true

    DashboardHealth:
      type: object
      required:
        - ok
        - started
        - host
        - version
      properties:
        ok:
          type: boolean
          example: true
        started:
          type: number
          description: Epoch timestamp when this dashboard server process started
          example: 1763300000.0
        host:
          type: string
          description: Hostname of machine running the dashboard
          example: 'laptop.example'
        version:
          type: string
          description: Version of Tutti software currently running
          example: '0.23.7'

    DashboardState:
      type: object
      description: Complete dashboard state object snapshot
      properties:
        autopilot:
          type: object
        config:
          type: object
        controls:
          type: object
        devices:
          type: object
        disk:
          type: object
        dispatch:
          type: object
        failover:
          type: object
        fleet:
          type: object
        generated_at:
          type: number
        household:
          type: object
        household_use:
          type: object
        hygiene:
          type: object
        jobs:
          type: array
          items:
            type: object
        local_models:
          type: object
        machines:
          type: object
        main:
          type: object
        outside:
          type: object
        presence:
          type: object
        probe_error:
          type: string
          nullable: true
        projects:
          type: object
        queue:
          type: object
        refresh_seconds:
          type: number
        releases_stuck:
          type: array
          items:
            type: object
        scouts:
          type: object
        security:
          type: object
        selfheal:
          type: object
        setup:
          type: object
        summary:
          type: object
        telemetry:
          type: object
        updates:
          type: object
        usage:
          type: object
        version:
          type: string
        where:
          type: object
        work_browser:
          type: object
        work_queue:
          type: object
        workers:
          type: object

    SettingsView:
      type: object
      description: Structure and current values for the Settings view
      properties:
        sections:
          type: object
        etag:
          type: string
        divergent:
          type: array
          items:
            type: string

    SettingsUpdateRequest:
      type: object
